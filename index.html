<script>
(function () {
  const { useState, useMemo } = React;
  const html = htm.bind(React.createElement);
  const L = window.LucideReact || {};
  const Icon = (name) => L[name] || (() => null);
  const Plane = Icon('Plane'), Wine = Icon('Wine'), Flame = Icon('Flame'), Moon = Icon('Moon'),
        Building2 = Icon('Building2'), Mountain = Icon('Mountain'), Wallet = Icon('Wallet'),
        PartyPopper = Icon('PartyPopper'), CalendarClock = Icon('CalendarClock'), Crown = Icon('Crown'),
        Lock = Icon('Lock'), Utensils = Icon('Utensils'), Sparkles = Icon('Sparkles'), Users = Icon('Users');

  const eur = (n) => new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(Math.round(n));

  const FLIGHTS = 1050, PARTY = 250, DAYS = 7, PAYERS = 10;

  const MAZZA_OPTS = [
    { id: 1, title: 'Volo + 2 serate devasto', desc: 'I 10 coprono voli e 2 serate del Mazza. Pernottamenti e spese vive li paga lui.' },
    { id: 2, title: 'Volo + pernottamenti + 2 serate devasto', desc: 'I 10 coprono voli, case e 2 serate del Mazza. Lui paga solo le spese vive.' }
  ];
  const SPLIT_OPTS = [
    { id: '33', ba: 3, men: 3, title: '3 notti BA + 3 Mendoza', badge: 'Consigliata' },
    { id: '42', ba: 4, men: 2, title: '4 notti BA + 2 Mendoza' }
  ];
  const BA_OPTS = [
    { v: 95, title: 'Attico Puerto Madero' },
    { v: 60, title: 'Appartamento Palermo Soho' },
    { v: 40, title: 'Standard' }
  ];
  const MEN_OPTS = [
    { v: 110, title: 'Villa Deluxe tra i vigneti con piscina' },
    { v: 65, title: 'Finca Premium' },
    { v: 45, title: 'Posada Standard' }
  ];
  const DAILY_OPTS = [
    { v: 45, title: 'Easy' },
    { v: 80, title: 'Posh' }
  ];

  function Choice({ selected, onClick, title, sub, price, badge, tone }) {
    const on = tone === 'malbec'
      ? 'border-malbec bg-vino ring-1 ring-malbec'
      : 'border-celeste bg-cielo ring-1 ring-celeste';
    return html`
      <button type="button" role="radio" aria-checked=${selected} onClick=${onClick}
        class=${'w-full text-left rounded-xl border px-4 py-3 transition-colors ' + (selected ? on : 'border-gray-200 bg-white hover:border-gray-400')}>
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0">
            <div class="flex flex-wrap items-center gap-2">
              <span class="font-semibold leading-snug">${title}</span>
              ${badge && html`<span class="text-xs font-semibold rounded-full bg-sol/20 text-[#8a6400] px-2 py-0.5">${badge}</span>`}
            </div>
            ${sub && html`<p class="text-sm text-gray-600 mt-1 leading-snug">${sub}</p>`}
          </div>
          ${price != null && html`<span class="shrink-0 font-semibold tabular-nums">${price}</span>`}
        </div>
      </button>`;
  }

  function Group({ icon: I, title, hint, children, cols }) {
    return html`
      <fieldset class="border-0 p-0 m-0">
        <legend class="flex items-center gap-2 text-lg font-semibold mb-1">
          <${I} size=${20} className="text-celeste" /> ${title}
        </legend>
        ${hint && html`<p class="text-sm text-gray-500 mb-3">${hint}</p>`}
        <div role="radiogroup" class=${'grid gap-2 ' + (cols || 'sm:grid-cols-2')}>${children}</div>
      </fieldset>`;
  }

  function Skyline() {
    return html`
      <svg viewBox="0 0 400 220" class="w-full h-full" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs><linearGradient id="skyBA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F6B26B"/><stop offset="1" stop-color="#C0392B"/></linearGradient></defs>
        <rect width="400" height="220" fill="url(#skyBA)"/>
        <circle cx="300" cy="80" r="34" fill="#FFE08A" opacity=".9"/>

          <rect x="190" y="30" width="10" height="190"/><polygon points="185,40 195,5 205,40"/>
          <rect x="90" y="110" width="50" height="110"/><rect x="145" y="70" width="36" height="150"/>
          <rect x="215" y="100" width="44" height="120"/><rect x="265" y="130" width="30" height="90"/>
          <rect x="300" y="95" width="42" height="125"/><rect x="348" y="120" width="52" height="100"/>
        </g>
        <g stroke="#FFD166" stroke-width="5" stroke-linecap="round" opacity=".95">
          <line x1="40" y1="206" x2="360" y2="206"/>
        </g>
        <g fill="#FFD166"><path d="M70 196 q10 -18 20 0 q10 -18 20 0 q10 -18 20 0" stroke="#FF8C42" stroke-width="3" fill="none"/></g>
      </svg>`;
  }

  function Andes() {
    return html`
      <svg viewBox="0 0 400 220" class="w-full h-full" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <defs><linearGradient id="skyM" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9CC9EE"/><stop offset="1" stop-color="#EAF3FB"/></linearGradient></defs>
        <rect width="400" height="220" fill="url(#skyM)"/>
        <polygon points="0,140 70,50 130,120 200,30 270,110 330,60 400,130 400,220 0,220" fill="#6B7A99"/>
        <polygon points="70,50 88,72 58,70" fill="#fff"/><polygon points="200,30 222,58 180,56" fill="#fff"/><polygon points="330,60 346,80 316,78" fill="#fff"/>
        <rect y="150" width="400" height="70" fill="#7FA650"/>
        <g stroke="#3F6B2A" stroke-width="6" stroke-linecap="round">
          <line x1="-20" y1="220" x2="120" y2="155"/><line x1="60" y1="220" x2="170" y2="155"/>
          <line x1="150" y1="220" x2="215" y2="155"/><line x1="245" y1="220" x2="245" y2="155"/>
          <line x1="340" y1="220" x2="280" y2="155"/><line x1="430" y1="220" x2="320" y2="155"/>
        </g>
        <g fill="#7A1F3D"><circle cx="110" cy="182" r="4"/><circle cx="118" cy="188" r="4"/><circle cx="250" cy="190" r="4"/><circle cx="310" cy="184" r="4"/></g>
      </svg>`;
  }

  function App() {
    const [mazza, setMazza] = useState(null);
    const [split, setSplit] = useState('33');
    const [ba, setBa] = useState(60);
    const [men, setMen] = useState(110);
    const [daily, setDaily] = useState(45);

    const s = SPLIT_OPTS.find(o => o.id === split);
    const calc = useMemo(() => {
      const baCost = s.ba * ba, menCost = s.men * men, dailyCost = DAYS * daily;
      const base = FLIGHTS + baCost + menCost + dailyCost + PARTY;
      let extra = 0, mazzaPays = base;
      if (mazza === 1) { extra = (FLIGHTS + PARTY) / PAYERS; mazzaPays = base - (FLIGHTS + PARTY); }
      if (mazza === 2) { const covered = FLIGHTS + baCost + menCost + PARTY; extra = covered / PAYERS; mazzaPays = base - covered; }
      return { baCost, menCost, dailyCost, base, extra, total: base + extra, mazzaPays };
    }, [s, ba, men, daily, mazza]);

            Addio celibato Mazza & Viaggio in Argentina

        <section class="max-w-5xl mx-auto px-5 mt-14">
          <h2 class="text-3xl font-extrabold tracking-tight">Chicche già cercate e must da fare</h2>
          <div class="mt-6 grid md:grid-cols-3 gap-6">
            <div class="border-l-4 border-[#C2410C] pl-4">
              <h3 class="font-bold text-lg flex items-center gap-2"><${Utensils} size=${18} className="text-[#C2410C]"/> Parrillas a Buenos Aires</h3>
              <p class="text-gray-700 mt-2"><strong>Don Julio</strong> e <strong>La Cabrera</strong>: tagli di carne clamorosi, perfetti per i gusti del Mazza.</p>
            </div>
            <div class="border-l-4 border-celeste pl-4">
              <h3 class="font-bold text-lg flex items-center gap-2"><${PartyPopper} size=${18} className="text-celeste"/> Vita notturna BA</h3>
              <p class="text-gray-700 mt-2"><strong>Uptown</strong> (speakeasy dove si entra da una finta metro), <strong>The Hole</strong>, <strong>Crobar</strong> e <strong>Bayside</strong> per fare l'alba.</p>
            </div>
            <div class="border-l-4 border-malbec pl-4">
              <h3 class="font-bold text-lg flex items-center gap-2"><${Wine} size=${18} className="text-malbec"/> Mendoza: relax e vino</h3>
              <p class="text-gray-700 mt-2">Tour tra <strong>Valle de Uco</strong> e <strong>Luján de Cuyo</strong>. Cantine top: <strong>Zuccardi</strong> (architettura in pietra pazzesca) e <strong>Catena Zapata</strong> (a forma di piramide). Asado in villa garantito.</p>
            </div>
          </div>
        </section>

            <//>

            <${Group} icon=${Wallet} title="Budget giornaliero" hint="Cibo, trasporti e spese vive, per 7 giorni.">
              ${DAILY_OPTS.map(o => html`<${Choice} key=${o.v} selected=${daily === o.v} onClick=${() => setDaily(o.v)} title=${o.title} price=${eur(o.v) + ' / giorno'} />`)}
            <//>

            <div class="rounded-2xl border-2 border-dashed border-[#C2410C]/50 p-5 flex flex-col sm:flex-row sm:items-center gap-3 justify-between">
              <div>
                <h3 class="text-lg font-semibold flex items-center gap-2"><${Flame} size=${20} className="text-[#C2410C]"/> 2 notti devasto <${Lock} size=${14} className="text-gray-400"/></h3>
                <p class="text-sm text-gray-500">Totale a persona per entrambe le serate.</p>
                <p class="text-sm text-gray-600 mt-1">Qui ci sta il devasto pesante per Mazza (club, tavoli, cena premium, bordelli, etc.).</p>
              </div>
              <span class="text-2xl font-extrabold tabular-nums">${eur(PARTY)}</span>
            </div>

            <div class="rounded-2xl bg-stone p-5">
              <h3 class="font-semibold mb-3 flex items-center gap-2"><${Sparkles} size=${18} className="text-sol"/> Dettaglio quota base</h3>
              <dl class="grid grid-cols-[1fr_auto] gap-y-1.5 text-sm tabular-nums">
                <dt class="text-gray-600">Voli A/R + interno</dt><dd>${eur(FLIGHTS)}</dd>
                <dt class="text-gray-600">${s.ba} notti Buenos Aires</dt><dd>${eur(calc.baCost)}</dd>
                <dt class="text-gray-600">${s.men} notti Mendoza</dt><dd>${eur(calc.menCost)}</dd>
                <dt class="text-gray-600">7 giorni spese vive</dt><dd>${eur(calc.dailyCost)}</dd>
                <dt class="text-gray-600">2 notti devasto</dt><dd>${eur(PARTY)}</dd>
                <dt class="font-semibold border-t border-gray-300 pt-2 mt-1">Quota base</dt><dd class="font-semibold border-t border-gray-300 pt-2 mt-1">${eur(calc.base)}</dd>
                ${mazza && html`<dt class="text-malbec">Contributo quota Mazza</dt><dd class="text-malbec">+ ${eur(calc.extra)}</dd>`}
              </dl>
            </div>
          </div>
        </section>

        <section class="max-w-5xl mx-auto px-5 mt-14">
          <h2 class="text-3xl font-extrabold tracking-tight flex items-center gap-3"><${CalendarClock} size=${28} className="text-celeste"/> Cose da fare ora</h2>
          <ol class="mt-6 space-y-4">
            ${[
              ['10 novembre', 'Prenotazione voli A/R e volo interno.'],
              ['30 novembre', 'Prenotazione case con free cancellation su Booking.'],
              ['30 gennaio', 'Prenotazione locali, discoteche, parrillas ed eventi per le due notti di devasto a BA.']
            ].map(([d, t], i) => html`
              <li key=${i} class="flex gap-4 items-start">
                <span class="shrink-0 w-9 h-9 rounded-full bg-ink text-white grid place-items-center font-bold">${i + 1}</span>
                <div><div class="font-semibold">Entro il ${d}</div><div class="text-gray-600">${t}</div></div>
              </li>`)}
          </ol>
        </section>

        <footer class="fixed bottom-0 inset-x-0 z-20 bg-white/95 backdrop-blur border-t border-gray-200 shadow-[0_-6px_24px_rgba(22,33,58,.08)]">
          <div class="max-w-5xl mx-auto px-5 pt-3 footer-safe">
            ${mazza == null
              ? html`<p class="py-2 text-center font-semibold text-malbec">Seleziona come gestire la quota di Mazza per vedere il totale</p>`
              : html`
                <div class="flex items-center justify-between gap-4">
                  <div class="min-w-0">
                    <div class="text-sm text-gray-500 flex items-center gap-1.5"><${Users} size=${14}/> Totale a persona · 10 paganti</div>
                    <div class="text-xs text-gray-500 mt-0.5 truncate">Il Mazza paga: ${eur(calc.mazzaPays)}</div>
                  </div>
                  <div key=${Math.round(calc.total)} class="pop text-3xl sm:text-4xl font-extrabold tabular-nums text-ink">${eur(calc.total)}</div>
                </div>`}
          </div>
        </footer>
      </div>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
})();
</script>
</body>
</html>
